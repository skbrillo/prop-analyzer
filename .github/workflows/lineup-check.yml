
name: NBA Pregame Lineup Check

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-lineup-check
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RotoWire parser
        run: python -m pip install beautifulsoup4

      - name: Check NBA lineups
        id: lineup_check
        continue-on-error: true
        run: python check_nba_lineups.py

      - name: Verify lineup output
        run: |
          if [ -f docs/nba_lineups.json ]; then
            echo "NBA lineup file exists."
            python -m json.tool docs/nba_lineups.json > /dev/null
          else
            echo "::warning::NBA lineup file was not created."
          fi

      - name: Save lineup results
        if: hashFiles('docs/nba_lineups.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/nba_lineups.json

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA pregame lineups"
            git pull --rebase
            git push
          fi

      - name: Report collector failure
        if: steps.lineup_check.outcome == 'failure'
        run: |
          echo "::error::NBA lineup collector failed. Review the Python step above."
          exit 1
