
name: Daily Prop Analyzer

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NBA API
        run: pip install nba_api pandas

      - name: Test ESPN connection
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261109"

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          games = data.get("events", [])
          print(f"ESPN connection successful: {len(games)} games found")

          if not games:
              raise RuntimeError("ESPN returned no games")
          PY

      - name: Run prediction engine
        run: python engine.py

      - name: Save updated data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game_logs.csv docs/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA statistics and projections"
            git push
          fi
