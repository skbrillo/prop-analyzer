
name: Daily Prop Analyzer

on:
  schedule:
    # Morning predictions:
    # 5:00 AM Central Standard Time
    # 6:00 AM Central Daylight Time
    - cron: "0 11 * * *"

    # Late-night grading:
    # 11:30 PM Central Standard Time
    # 12:30 AM Central Daylight Time
    # No Odds API credits used
    - cron: "30 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prop-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Download completed NBA game statistics.
      # ESPN data does not consume Odds API credits.

      - name: Download real NBA statistics
        run: python update_nba_stats.py

      # Build historical team defensive statistics.

      - name: Build NBA team defense statistics
        run: python build_team_defense.py

      # Download DraftKings odds only during
      # the morning run or a manual run.

      - name: Download real DraftKings odds
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_odds.py

      # Generate current NBA prop predictions.

      - name: Run prediction engine
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
        run: python engine.py

      # Rank the strongest qualifying bets.
      # Reads existing predictions.
      # No additional Odds API credits used.

      - name: Run Top 25 Edge Model
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
        run: python edge_model.py

      # Save original pregame predictions.

      - name: Save pregame predictions
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
        run: python save_predictions.py

      # Update automatic prop tracking.
      # No Odds API requests.

      - name: Update automatic prop tracking
        run: python track_results.py

      # Grade completed predictions.
      # No Odds API requests.

      - name: Grade completed predictions
        run: python grade_predictions.py

      # Historical backtesting.

      - name: Backtest historical NBA projections
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
        run: python backtest.py

      # Save updated statistics, predictions,
      # edge rankings, grading, and backtesting.

      - name: Save updated data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/game_logs.csv
          git add data/team_defense.csv
          git add data/sample_odds.csv
          git add data/prediction_history.csv

          git add docs/results.json
          git add docs/graded_predictions.json
          git add docs/backtest.json
          git add docs/tracking.json

          git add docs/edge_results.json
          git add docs/edge_top25.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA predictions, Top 25 Edge Model, and performance tracking"
            git push
          fi
