
name: Daily Prop Analyzer

on:
  schedule:
    # 5 AM Central, including daylight saving time.
    - cron: "0 10,11 * * *"

    # 4 PM Central, including daylight saving time.
    - cron: "0 21,22 * * *"

    # Overnight grading, approximately 11:30 PM Central.
    - cron: "30 4,5 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prop-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    env:
      TZ: America/Chicago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GitHub Actions schedules run in UTC.
      # Check the actual Central time to avoid
      # duplicate runs during daylight saving changes.

      - name: Determine run type
        id: schedule
        shell: bash
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          MINUTE=$(TZ=America/Chicago date +%M)

          echo "Central time: $HOUR:$MINUTE"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=manual" >> "$GITHUB_OUTPUT"
            echo "run_predictions=true" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "05" ] && [ "$MINUTE" = "00" ]; then
            echo "run_type=morning" >> "$GITHUB_OUTPUT"
            echo "run_predictions=true" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "16" ] && [ "$MINUTE" = "00" ]; then
            echo "run_type=afternoon" >> "$GITHUB_OUTPUT"
            echo "run_predictions=true" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "23" ] && [ "$MINUTE" = "30" ]; then
            echo "run_type=grading" >> "$GITHUB_OUTPUT"
            echo "run_predictions=false" >> "$GITHUB_OUTPUT"

          else
            echo "run_type=skip" >> "$GITHUB_OUTPUT"
            echo "run_predictions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show run information
        run: |
          echo "Run type: ${{ steps.schedule.outputs.run_type }}"
          echo "Predictions: ${{ steps.schedule.outputs.run_predictions }}"

      # Refresh NBA game logs and defensive data.

      - name: Download real NBA statistics
        if: steps.schedule.outputs.run_type != 'skip'
        run: python update_nba_stats.py

      - name: Build NBA team defense statistics
        if: steps.schedule.outputs.run_type != 'skip'
        run: python build_team_defense.py

      # ParlayAPI replaces The Odds API.
      # The collector protects existing odds when
      # the provider returns an incomplete board.

      - name: Download DraftKings odds from ParlayAPI
        if: steps.schedule.outputs.run_predictions == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python update_odds.py

      # Generate fresh predictions after the odds update.

      - name: Run prediction engine
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python engine.py

      - name: Run Top 25 Edge Model
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python edge_model.py

      # Archive pregame predictions and rankings.
      # Existing scripts retain responsibility
      # for preventing duplicate historical records.

      - name: Save pregame predictions
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python save_predictions.py

      - name: Update automatic prop tracking
        if: steps.schedule.outputs.run_type != 'skip'
        run: python track_results.py

      - name: Grade completed predictions
        if: steps.schedule.outputs.run_type != 'skip'
        run: python grade_predictions.py

      - name: Update Top 25 monthly performance
        if: steps.schedule.outputs.run_type != 'skip'
        run: python edge_monthly_tracker.py

      - name: Backtest historical NBA projections
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python backtest.py

      # Commit generated results.

      - name: Save updated data and results
        if: steps.schedule.outputs.run_type != 'skip'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            data/game_logs.csv \
            data/team_defense.csv \
            data/sample_odds.csv \
            data/prediction_history.csv \
            docs/results.json \
            docs/graded_predictions.json \
            docs/backtest.json \
            docs/tracking.json \
            docs/edge_results.json \
            docs/edge_top25.csv \
            docs/edge_archive/ \
            docs/edge_monthly.json

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA predictions and ParlayAPI results"
            git pull --rebase origin main
            git push origin main
          fi
