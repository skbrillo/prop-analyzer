name: Daily Prop Analyzer

on:
  schedule:
    # 5 AM Central
    - cron: "0 10,11 * * *"

    # 12 PM Central
    - cron: "0 17,18 * * *"

    # 4 PM Central
    - cron: "0 21,22 * * *"

    # 11:30 PM Central grading
    - cron: "30 4,5 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prop-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    env:
      TZ: America/Chicago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Determine the intended Central time from
      # the scheduled UTC time, not runner start time.
      # This tolerates delayed GitHub Actions jobs.

      - name: Determine run type
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          event = os.environ["EVENT_NAME"]
          schedule = os.environ.get("SCHEDULE", "")
          output = os.environ["GITHUB_OUTPUT"]

          run_type = "skip"

          if event == "workflow_dispatch":
              run_type = "manual"

          else:
              # Match the intended UTC cron slot against
              # Central local time for the current date.
              now = datetime.now(timezone.utc)
              central = ZoneInfo("America/Chicago")

              cron_slots = {
                  "0 10,11 * * *": (10, 11, 0),
                  "0 17,18 * * *": (17, 18, 0),
                  "0 21,22 * * *": (21, 22, 0),
                  "30 4,5 * * *": (4, 5, 30),
              }

              if schedule in cron_slots:
                  first_hour, second_hour, minute = cron_slots[schedule]

                  # Check recent possible scheduled slots.
                  # Delayed runs remain tied to their slot.
                  candidates = []

                  for day_offset in (0, -1):
                      day = (now + timedelta(days=day_offset)).date()

                      for hour in (first_hour, second_hour):
                          scheduled = datetime(
                              day.year, day.month, day.day,
                              hour, minute,
                              tzinfo=timezone.utc
                          )

                          if scheduled <= now:
                              candidates.append(scheduled)

                  if candidates:
                      scheduled = max(candidates)
                      local = scheduled.astimezone(central)

                      if schedule == "0 10,11 * * *":
                          if local.hour == 5:
                              run_type = "morning"

                      elif schedule == "0 17,18 * * *":
                          if local.hour == 12:
                              run_type = "midday"

                      elif schedule == "0 21,22 * * *":
                          if local.hour == 16:
                              run_type = "afternoon"

                      elif schedule == "30 4,5 * * *":
                          if local.hour == 23 and local.minute == 30:
                              run_type = "grading"

          predictions = run_type in (
              "morning", "midday", "afternoon", "manual"
          )

          with open(output, "a") as f:
              f.write(f"run_type={run_type}\n")
              f.write(f"run_predictions={str(predictions).lower()}\n")

          print("Run type:", run_type)
          print("Run predictions:", predictions)
          PY

      - name: Show run information
        run: |
          echo "Run type: ${{ steps.schedule.outputs.run_type }}"
          echo "Predictions: ${{ steps.schedule.outputs.run_predictions }}"

      # Update NBA statistics.

      - name: Download real NBA statistics
        if: steps.schedule.outputs.run_type != 'skip'
        run: python update_nba_stats.py

      - name: Build NBA team defense statistics
        if: steps.schedule.outputs.run_type != 'skip'
        run: python build_team_defense.py

      # Preserve the previous odds before downloading.
      # This is a local backup during the workflow.
      # Persistent historical snapshots require
      # a separate archive implementation.

      - name: Back up previous odds
        if: steps.schedule.outputs.run_predictions == 'true'
        shell: bash
        run: |
          if [ -f data/sample_odds.csv ]; then
            cp data/sample_odds.csv /tmp/previous_sample_odds.csv
          fi

      # Download DraftKings lines from ParlayAPI.
      # Maximum estimated cost: 5 credits per run.

      - name: Download DraftKings odds from ParlayAPI
        if: steps.schedule.outputs.run_predictions == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python update_odds.py

      # Run model and Top 25 rankings.

      - name: Run prediction engine
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python engine.py

      - name: Run Top 25 Edge Model
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python edge_model.py

      # Save predictions and update tracking.

      - name: Save pregame predictions
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python save_predictions.py

      - name: Update automatic prop tracking
        if: steps.schedule.outputs.run_type != 'skip'
        run: python track_results.py

      - name: Grade completed predictions
        if: steps.schedule.outputs.run_type != 'skip'
        run: python grade_predictions.py

      - name: Update Top 25 monthly performance
        if: steps.schedule.outputs.run_type != 'skip'
        run: python edge_monthly_tracker.py

      - name: Backtest historical NBA projections
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python backtest.py

      # Save all updated results.

      - name: Save updated data and results
        if: steps.schedule.outputs.run_type != 'skip'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            data/game_logs.csv \
            data/team_defense.csv \
            data/sample_odds.csv \
            data/prediction_history.csv \
            docs/results.json \
            docs/graded_predictions.json \
            docs/backtest.json \
            docs/tracking.json \
            docs/edge_results.json \
            docs/edge_top25.csv \
            docs/edge_archive/ \
            docs/edge_monthly.json \
            docs/line_movement.json

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA predictions and ParlayAPI results"
            git pull --rebase origin main
            git push origin main
          fi
