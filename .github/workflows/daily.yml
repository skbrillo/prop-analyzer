name: Daily Prop Analyzer

on:
  schedule:
    # 5 AM Central, accounting for CST/CDT
    - cron: '0 10,11 * * *'
    # 12 PM Central
    - cron: '0 17,18 * * *'
    # 4 PM Central
    - cron: '0 21,22 * * *'
    # 11:30 PM Central
    - cron: '30 4,5 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Choose run type (statistics/grading only do not fetch odds)'
        required: true
        type: choice
        default: full_model
        options:
          - full_model
          - statistics_only
          - grading_only

permissions:
  contents: write

concurrency:
  group: daily-prop-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine run type
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.run_mode }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          event = os.environ['EVENT_NAME']
          schedule = os.environ.get('SCHEDULE', '')
          requested = os.environ.get('REQUESTED_MODE', '')
          now = datetime.now(timezone.utc)
          central = ZoneInfo('America/Chicago')
          run_type = 'skip'

          if event == 'workflow_dispatch':
              run_type = {
                  'full_model': 'manual',
                  'statistics_only': 'statistics_only',
                  'grading_only': 'grading_only',
              }.get(requested, 'manual')
          elif event == 'schedule':
              cron_slots = {
                  '0 10,11 * * *': (10, 11, 0, 5, 0, 'morning'),
                  '0 17,18 * * *': (17, 18, 0, 12, 0, 'midday'),
                  '0 21,22 * * *': (21, 22, 0, 16, 0, 'afternoon'),
                  '30 4,5 * * *': (4, 5, 30, 23, 30, 'grading'),
              }
              if schedule in cron_slots:
                  h1, h2, minute, local_hour, local_minute, kind = cron_slots[schedule]
                  candidates = []
                  for offset in (0, -1, -2):
                      date = (now + timedelta(days=offset)).date()
                      for hour in (h1, h2):
                          slot = datetime(date.year, date.month, date.day,
                                          hour, minute, tzinfo=timezone.utc)
                          local = slot.astimezone(central)
                          if (local.hour, local.minute) == (local_hour, local_minute):
                              delay = (now - slot).total_seconds()
                              if 0 <= delay <= 10800:
                                  candidates.append((delay, slot))
                  if candidates:
                      run_type = kind

          run_predictions = run_type in ('morning', 'midday', 'afternoon', 'manual')
          run_stats = run_type in ('morning', 'midday', 'afternoon',
                                   'grading', 'manual', 'statistics_only')
          run_grading = run_type in ('morning', 'midday', 'afternoon',
                                     'grading', 'manual', 'grading_only')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_type={run_type}\n')
              f.write(f'run_predictions={str(run_predictions).lower()}\n')
              f.write(f'run_stats={str(run_stats).lower()}\n')
              f.write(f'run_grading={str(run_grading).lower()}\n')
          print('Run type:', run_type)
          print('Run predictions:', run_predictions)
          print('Update ESPN stats:', run_stats)
          print('Grade predictions:', run_grading)
          PY

      - name: Show run information
        run: |
          echo "Run type: ${{ steps.schedule.outputs.run_type }}"
          echo "Predictions: ${{ steps.schedule.outputs.run_predictions }}"
          echo "ESPN stats: ${{ steps.schedule.outputs.run_stats }}"
          echo "Grading: ${{ steps.schedule.outputs.run_grading }}"

      - name: Download real NBA statistics
        if: steps.schedule.outputs.run_stats == 'true'
        run: python update_nba_stats.py

      - name: Build NBA team defense statistics
        if: steps.schedule.outputs.run_stats == 'true'
        run: python build_team_defense.py

      - name: Back up previous odds
        if: steps.schedule.outputs.run_predictions == 'true'
        shell: bash
        run: |
          if [ -f data/sample_odds.csv ]; then
            cp data/sample_odds.csv /tmp/previous_sample_odds.csv
          fi

      - name: Download DraftKings odds from ParlayAPI
        if: steps.schedule.outputs.run_predictions == 'true'
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python update_odds.py

      - name: Run prediction engine
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python engine.py

      - name: Run Top 25 Edge Model
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python edge_model.py

      - name: Save pregame predictions
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python save_predictions.py

      - name: Update automatic prop tracking
        if: steps.schedule.outputs.run_grading == 'true'
        run: python track_results.py

      - name: Grade completed predictions
        if: steps.schedule.outputs.run_grading == 'true'
        run: python grade_predictions.py

      - name: Update Top 25 monthly performance
        if: steps.schedule.outputs.run_predictions == 'true' || steps.schedule.outputs.run_grading == 'true'
        run: python edge_monthly_tracker.py

      - name: Backtest historical NBA projections
        if: steps.schedule.outputs.run_predictions == 'true'
        run: python backtest.py

      - name: Save updated data and results
        if: steps.schedule.outputs.run_type != 'skip'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- \
            data/game_logs.csv \
            data/game_dnp.json \
            data/game_logs_audit.json \
            data/team_defense.csv \
            data/sample_odds.csv \
            data/prediction_history.csv \
            docs/results.json \
            docs/graded_predictions.json \
            docs/backtest.json \
            docs/tracking.json \
            docs/edge_results.json \
            docs/edge_top25.csv \
            docs/edge_archive/ \
            docs/edge_monthly.json \
            docs/line_movement.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA predictions, statistics and grading results'
            git pull --rebase origin main
            git push origin main
          else
            echo 'No changed data to commit.'
          fi
