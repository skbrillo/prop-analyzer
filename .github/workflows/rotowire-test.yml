name: Test RotoWire Page Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test public NBA lineups page
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          url = 'https://www.rotowire.com/basketball/nba-lineups.php'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (compatible; NBA-Lineup-Access-Test/1.0)',
              'Accept': 'text/html',
          })
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  html = response.read().decode('utf-8', errors='replace')
                  print('HTTP status:', response.status)
                  print('HTML characters:', len(html))
                  for phrase in ('Confirmed Lineup', 'Expected Lineup', 'nba-lineups'):
                      print(f'{phrase}:', phrase.lower() in html.lower())
                  if response.status != 200 or len(html) < 1000:
                      raise SystemExit('Page did not return usable HTML')
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit(f'Unable to fetch page: {exc}')
          PY
