name: NFL Weather

# Kickoff forecasts for this week's NFL games (Open-Meteo, free, no API key).
# Every 2 hours, at 40 minutes past. Writes docs/nfl_weather.json only.

on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch kickoff forecasts
        run: python nfl_weather.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nfl_weather.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Update NFL kickoff weather"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
