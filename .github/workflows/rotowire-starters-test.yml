
name: Test RotoWire Five Starters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Extract five starters per team
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from bs4 import BeautifulSoup

          url = 'https://www.rotowire.com/basketball/nba-lineups.php'
          request = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'text/html',
          })

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode('utf-8', errors='replace')
              print('HTTP:', response.status)

          soup = BeautifulSoup(html, 'html.parser')
          valid_teams = 0
          errors = []

          for card in soup.select('.lineup__box'):
              teams = card.select('.lineup__team')
              if len(teams) != 2:
                  continue

              print('\nMATCHUP')

              for team in teams:
                  abbr = team.get_text(' ', strip=True)
                  side = 'visit' if 'is-visit' in team.get('class', []) else 'home'
                  column = card.select_one('.lineup__list.is-' + side)

                  if column is None:
                      errors.append(f'{abbr}: no {side} lineup list')
                      print(f'  {abbr}: LINEUP LIST NOT FOUND')
                      continue

                  heading = column.select_one('.lineup__status')
                  status = heading.get_text(' ', strip=True) if heading else 'Unknown'

                  players = []
                  for li in column.select('li'):
                      if 'lineup__player' not in li.get('class', []):
                          continue
                      if len(players) == 5:
                          break

                      name_el = li.select_one('a')
                      name = name_el.get_text(' ', strip=True) if name_el else li.get_text(' ', strip=True)
                      name = re.sub(r'\s+(Ques|Prob|Out|Doubt)$', '', name).strip()

                      if name:
                          players.append(name)

                  print(f'  {abbr} [{status}]: {len(players)} starters: {", ".join(players)}')

                  if (
                      len(players) == 5
                      and len(set(players)) == 5
                      and ('Confirmed' in status or 'Expected' in status)
                  ):
                      valid_teams += 1
                  else:
                      errors.append(f'{abbr}: {len(players)} players, status={status!r}')

          print(f'\nVALID TEAMS: {valid_teams}')
          print(f'ERRORS: {len(errors)}')

          for error in errors:
              print('ERROR:', error)

          if valid_teams == 0 or errors:
              raise SystemExit('Parser validation failed; see details above.')
          PY
