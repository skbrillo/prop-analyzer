name: Closing Line Capture

# Runs every 10 minutes through the NBA game window (11 AM - midnight Central).
# Each run makes one free events call; it only spends credits when a game tips
# within the next 25 minutes and has not been captured yet (max 4 per day).

on:
  schedule:
    - cron: "*/10 16-23,0-5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Snapshot mode"
        required: true
        type: choice
        default: closing
        options:
          - closing
          - open
          - probe

permissions:
  contents: write

concurrency:
  group: closing-line-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture market snapshot
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          MARKET_BOOKS: ${{ vars.MARKET_BOOKS }}
        run: python market_snapshot.py --${{ inputs.mode || 'closing' }}

      - name: Save snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_snapshots/ || true
          if git diff --cached --quiet; then
            echo "No new snapshots."
            exit 0
          fi
          git commit -m "Capture NBA market snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::Could not push snapshots after 3 attempts"
          exit 1
