name: NFL Props Probe

# Manual only. One free events call plus one paid props request.
# Prints a report in the log; writes and commits nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run NFL probe
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python nfl_probe.py
